plugins {
    id 'com.android.application'
}

android {
    namespace 'com.watermark.app'
    compileSdk 34

    defaultConfig {
        applicationId 'com.watermark.app'
        // 自适应图标 + WebViewAssetLoader 要求 API 26+，取 26 起步
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        debug {
            minifyEnabled false
        }
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.webkit:webkit:1.9.0'
}
