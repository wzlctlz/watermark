plugins {
    id 'com.android.application'
}

android {
    namespace 'com.watermark.app'
    compileSdk 34
    // 本机 SDK（D:\Projects\SDK\Andriod）只装了 build-tools 36.0.0，
    // 而 AGP 8.2.2 默认取 34.0.0，故显式固定为已安装的 36.0.0，避免再下载。
    buildToolsVersion '36.0.0'

    defaultConfig {
        applicationId 'com.watermark.app'
        // 自适应图标 + WebViewAssetLoader 要求 API 26+，取 26 起步
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        debug {
            minifyEnabled false
        }
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.webkit:webkit:1.9.0'
}
