<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/x-icon" href="favicon.ico?v=3">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png?v=3">
  <link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png?v=3">
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png?v=3">
  <link rel="shortcut icon" href="favicon.ico?v=3">
  <title>水印相机</title>

  <!-- Tailwind CSS（主流开源UI框架，免构建） -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: { brand: { DEFAULT: '#10b981', dark: '#34d399' } },
          fontFamily: { sans: ['-apple-system', 'BlinkMacSystemFont', '"Segoe UI"', 'Roboto', '"PingFang SC"', '"Microsoft YaHei"', 'sans-serif'] }
        }
      }
    }
  </script>

  <!-- 主题初始化：在首屏渲染前同步设置，避免明暗闪烁 -->
  <script>
    (function () {
      try {
        var saved = localStorage.getItem('wm-theme') || 'system'
        var sysDark = window.matchMedia('(prefers-color-scheme: dark)').matches
        var isDark = saved === 'dark' || (saved === 'system' && sysDark)
        document.documentElement.classList.toggle('dark', isDark)
        document.documentElement.setAttribute('data-theme', saved)
      } catch (e) {}
    })()
  </script>

  <style>
    /* ===== 主题变量（明暗两态，由 .dark 切换） ===== */
    :root {
      --bg: #f1f5f9;
      --card: #ffffff;
      --primary: #10b981;
      --primary-hover: #059669;
      --primary-light: #ecfdf5;
      --text: #1e293b;
      --text2: #64748b;
      --border: #e2e8f0;
      --danger: #ef4444;
      --success: #10b981;
      --warning: #f59e0b;
      --input-bg: #f8fafc;
      --log-bg: #0f172a;
      --log-text: #cbd5e1;
    }
    html.dark {
      --bg: #0b1120;
      --card: #15203a;
      --primary: #10b981;
      --primary-hover: #34d399;
      --primary-light: #06231b;
      --text: #e2e8f0;
      --text2: #94a3b8;
      --border: #2b3a55;
      --input-bg: #0e1830;
      --log-bg: #060b16;
      --log-text: #cbd5e1;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', 'Microsoft YaHei', sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
      transition: background .3s ease, color .3s ease;
      -webkit-font-smoothing: antialiased;
    }

    /* ===== 照片网格（动态组件，app.js 按类名操作） ===== */
    .photo-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(108px, 1fr)); gap: 12px; }
    .photo-item {
      position: relative; border-radius: 12px; overflow: hidden; aspect-ratio: 4/3;
      background: var(--input-bg); cursor: pointer; border: 2px solid transparent; transition: all .2s ease;
    }
    .photo-item:hover { border-color: var(--primary); transform: translateY(-2px); box-shadow: 0 8px 22px rgba(0,0,0,.14); }
    .photo-item.selected { border: 3px solid var(--danger); box-shadow: 0 0 0 3px rgba(239,68,68,.22); }
    .photo-item.select-mode { cursor: crosshair; }
    .photo-item.select-mode:hover { border-color: var(--danger); box-shadow: 0 6px 16px rgba(239,68,68,.18); }
    .photo-item img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .photo-item .btn-delete {
      position: absolute; top: 5px; right: 5px; width: 22px; height: 22px; border-radius: 50%;
      background: rgba(239,68,68,.9); color: #fff; border: none; font-size: 15px; line-height: 22px;
      text-align: center; cursor: pointer; z-index: 10; display: flex; align-items: center; justify-content: center;
      padding: 0; opacity: 0; transition: opacity .2s;
    }
    .photo-item:hover .btn-delete { opacity: 1; }
    @media (hover: none) { .photo-item .btn-delete { opacity: .75; } }
    .photo-item .badge { position: absolute; top: 28px; right: 5px; padding: 2px 6px; border-radius: 5px; font-size: 10px; font-weight: 700; color: #fff; line-height: 1.2; }
    .badge-gps { background: var(--success); }
    .badge-nogps { background: var(--warning); }
    .badge-done { background: var(--primary); }
    .photo-item .badge-res { position: absolute; top: 5px; left: 5px; padding: 2px 6px; border-radius: 5px; font-size: 10px; font-weight: 800; color: #fff; line-height: 1.2; width: auto; }
    .photo-item .filename { position: absolute; bottom: 0; left: 0; right: 0; padding: 4px 6px; background: rgba(0,0,0,.6); color: #fff; font-size: 10px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    /* ===== 预览弹窗 ===== */
    .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.82); z-index: 1000; align-items: center; justify-content: center; padding: 16px; backdrop-filter: blur(4px); }
    .modal-overlay.active { display: flex; }
    .modal-content { max-width: 92vw; max-height: 92vh; position: relative; }
    .modal-content img { max-width: 100%; max-height: 82vh; border-radius: 12px; box-shadow: 0 20px 60px rgba(0,0,0,.5); }
    .modal-close { position: absolute; top: -14px; right: -14px; width: 34px; height: 34px; border-radius: 50%; background: #fff; border: none; font-size: 18px; cursor: pointer; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 12px rgba(0,0,0,.4); z-index: 10; }
    .modal-info { background: rgba(0,0,0,.7); color: #fff; padding: 10px 16px; border-radius: 0 0 12px 12px; font-size: 12px; display: flex; gap: 16px; flex-wrap: wrap; }

    /* ===== 日志区 ===== */
    .log-area { height: 180px; overflow-y: auto; background: var(--log-bg); color: var(--log-text); padding: 12px 14px; border-radius: 12px; font-family: 'Consolas','Monaco','SF Mono', monospace; font-size: 11px; line-height: 1.7; }
    .log-ok { color: #34d399; }
    .log-warn { color: #fbbf24; }
    .log-err { color: #f87171; }

    /* ===== 进度条 ===== */
    .progress-bar { height: 6px; background: var(--border); border-radius: 4px; overflow: hidden; }
    .progress-fill { height: 100%; background: var(--primary); border-radius: 4px; transition: width .3s ease; }
    .progress-text { font-size: 12px; color: var(--text2); margin-top: 8px; text-align: center; }

    /* ===== 开关 ===== */
    .switch { position: relative; display: inline-block; width: 40px; height: 22px; flex-shrink: 0; }
    .switch input { opacity: 0; width: 0; height: 0; }
    .switch .slider { position: absolute; inset: 0; background: #cbd5e1; border-radius: 22px; cursor: pointer; transition: .25s; }
    .switch .slider:before { content: ''; position: absolute; height: 16px; width: 16px; left: 3px; top: 3px; background: #fff; border-radius: 50%; transition: .25s; box-shadow: 0 1px 3px rgba(0,0,0,.25); }
    .switch input:checked + .slider { background: var(--primary); }
    .switch input:checked + .slider:before { transform: translateX(18px); }

    /* ===== 缩放滑块 ===== */
    .zoom-row { display: flex; align-items: center; gap: 10px; margin-top: 6px; }
    .zoom-row input[type=range] { flex: 1; height: 6px; -webkit-appearance: none; appearance: none; background: var(--border); border-radius: 3px; outline: none; }
    .zoom-row input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 18px; height: 18px; border-radius: 50%; background: var(--primary); cursor: pointer; box-shadow: 0 1px 4px rgba(0,0,0,.3); }
    .zoom-row input[type=range]::-moz-range-thumb { width: 18px; height: 18px; border: none; border-radius: 50%; background: var(--primary); cursor: pointer; }
    .zoom-value { font-size: 13px; font-weight: 700; color: var(--text); min-width: 22px; text-align: center; }
    .zoom-range { font-size: 11px; color: var(--text2); }

    /* ===== 动画 / 滚动条 ===== */
    @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
    .photo-item { animation: fadeIn .25s ease; }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-thumb { background: #94a3b8; border-radius: 3px; }
  </style>
</head>
<body>

  <!-- ===== 顶部栏 ===== -->
  <header class="sticky top-0 z-50 backdrop-blur bg-white/80 dark:bg-slate-900/80 border-b border-slate-200 dark:border-slate-800 transition-colors">
    <div class="max-w-4xl mx-auto px-4 h-14 flex items-center justify-between">
      <div class="flex items-center gap-2.5">
        <div class="w-9 h-9 rounded-xl bg-gradient-to-br from-emerald-400 to-teal-500 flex items-center justify-center shadow-lg shadow-emerald-500/30">
          <svg viewBox="0 0 24 24" fill="none" class="w-5 h-5 text-white" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 8.5A2.5 2.5 0 0 1 5.5 6h1.2l1-1.6A1.5 1.5 0 0 1 9 3.6h6a1.5 1.5 0 0 1 1.3.8l1 1.6h1.2A2.5 2.5 0 0 1 21 8.5v9A2.5 2.5 0 0 1 18.5 20h-13A2.5 2.5 0 0 1 3 17.5z"/>
            <circle cx="12" cy="13" r="3.2"/>
          </svg>
        </div>
        <div class="leading-tight">
          <h1 class="text-base font-bold text-slate-800 dark:text-white">水印相机</h1>
          <p class="text-[11px] text-slate-400 dark:text-slate-500">勘察照片 · 一键批量水印</p>
        </div>
      </div>
      <button onclick="cycleTheme()" title="切换主题（系统 / 日间 / 夜间）"
        class="group flex items-center gap-1.5 px-3 py-1.5 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-700 transition text-sm">
        <span id="themeIcon">🌐</span>
        <span id="themeLabel" class="hidden sm:inline text-xs">跟随系统</span>
      </button>
    </div>
  </header>

  <main class="max-w-4xl mx-auto px-4 py-6 space-y-5">

    <!-- ===== 步骤 1：添加照片 ===== -->
    <section class="bg-white dark:bg-slate-800/80 rounded-2xl shadow-sm border border-slate-200 dark:border-slate-700/60 overflow-hidden transition-colors">
      <div class="px-5 py-4 border-b border-slate-100 dark:border-slate-700/50 flex items-center gap-3">
        <span class="flex items-center justify-center w-7 h-7 rounded-lg bg-emerald-500 text-white text-sm font-bold">1</span>
        <h2 class="text-[15px] font-semibold text-slate-800 dark:text-slate-100">添加照片</h2>
      </div>
      <div class="p-5">
        <div id="dropZone" onclick="document.getElementById('fileInput').click()"
          class="rounded-2xl border-2 border-dashed border-slate-300 dark:border-slate-600 bg-slate-50 dark:bg-slate-900/40 px-6 py-8 text-center hover:border-emerald-400 hover:bg-emerald-50/50 dark:hover:bg-emerald-900/10 transition cursor-pointer">
          <div class="text-4xl mb-2">📷</div>
          <div class="text-sm font-medium text-slate-600 dark:text-slate-300">点击选择照片，或拖拽文件夹到本页</div>
          <div class="text-xs text-slate-400 dark:text-slate-500 mt-1">支持 JPG / PNG · 可多选 · 手机端可选择拍照</div>
        </div>

        <div id="statsCard" class="flex flex-wrap gap-2.5 mt-4">
          <div class="flex items-center gap-1.5 px-3 py-1.5 rounded-lg bg-slate-100 dark:bg-slate-700/50 text-xs text-slate-500 dark:text-slate-300">
            <span class="w-2 h-2 rounded-full bg-emerald-500"></span>总计 <b id="statTotal" class="text-slate-800 dark:text-white ml-0.5">0</b>
          </div>
          <div class="flex items-center gap-1.5 px-3 py-1.5 rounded-lg bg-slate-100 dark:bg-slate-700/50 text-xs text-slate-500 dark:text-slate-300">
            <span class="w-2 h-2 rounded-full bg-emerald-500"></span>有GPS <b id="statGps" class="text-slate-800 dark:text-white ml-0.5">0</b>
          </div>
          <div class="flex items-center gap-1.5 px-3 py-1.5 rounded-lg bg-slate-100 dark:bg-slate-700/50 text-xs text-slate-500 dark:text-slate-300">
            <span class="w-2 h-2 rounded-full bg-amber-500"></span>无GPS <b id="statNoGps" class="text-slate-800 dark:text-white ml-0.5">0</b>
          </div>
          <div class="flex items-center gap-1.5 px-3 py-1.5 rounded-lg bg-slate-100 dark:bg-slate-700/50 text-xs text-slate-500 dark:text-slate-300">
            <span class="w-2 h-2 rounded-full bg-violet-500"></span>已处理 <b id="statDone" class="text-slate-800 dark:text-white ml-0.5">0</b>
          </div>
        </div>

        <div class="photo-grid mt-4" id="photoGrid"></div>
        <div id="photoEmpty" style="display:none" class="text-center py-8 text-slate-400 dark:text-slate-500 text-sm">暂无照片，先添加几张吧</div>
      </div>
    </section>

    <!-- ===== 步骤 2：水印配置 ===== -->
    <section class="bg-white dark:bg-slate-800/80 rounded-2xl shadow-sm border border-slate-200 dark:border-slate-700/60 overflow-hidden transition-colors">
      <div class="px-5 py-4 border-b border-slate-100 dark:border-slate-700/50 flex items-center gap-3">
        <span class="flex items-center justify-center w-7 h-7 rounded-lg bg-emerald-500 text-white text-sm font-bold">2</span>
        <h2 class="text-[15px] font-semibold text-slate-800 dark:text-slate-100">水印配置</h2>
        <div class="ml-auto flex items-center gap-2">
          <button onclick="event.stopPropagation();loadPhotoInfo()" title="从列表中选择一张照片，加载其GPS信息"
            class="px-3 py-1.5 rounded-lg bg-emerald-500 hover:bg-emerald-600 text-white text-xs font-medium transition active:scale-95">加载照片信息</button>
          <button id="configToggle" onclick="toggleConfig()"
            class="px-2 py-1.5 rounded-lg text-xs text-slate-400 dark:text-slate-500 hover:bg-slate-100 dark:hover:bg-slate-700 transition">收起 ▲</button>
        </div>
      </div>
      <div class="p-5" id="configBody">
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-x-5 gap-y-4">
          <div>
            <div class="flex items-center justify-between mb-1.5">
              <span class="text-xs font-medium text-slate-500 dark:text-slate-400">项目名称</span>
              <label class="switch"><input type="checkbox" id="showProject" checked><span class="slider"></span></label>
            </div>
            <input id="projectName" type="text" placeholder="例：XX工程勘察"
              class="w-full rounded-xl border border-slate-300 dark:border-slate-600 bg-slate-50 dark:bg-slate-900 px-3 py-2 text-sm text-slate-800 dark:text-slate-100 outline-none focus:border-emerald-500 focus:ring-2 focus:ring-emerald-500/30 transition">
          </div>
          <div>
            <div class="flex items-center justify-between mb-1.5">
              <span class="text-xs font-medium text-slate-500 dark:text-slate-400">备注</span>
              <label class="switch"><input type="checkbox" id="showRemark" checked><span class="slider"></span></label>
            </div>
            <input id="remarkText" type="text" placeholder="自定义备注内容"
              class="w-full rounded-xl border border-slate-300 dark:border-slate-600 bg-slate-50 dark:bg-slate-900 px-3 py-2 text-sm text-slate-800 dark:text-slate-100 outline-none focus:border-emerald-500 focus:ring-2 focus:ring-emerald-500/30 transition">
          </div>
          <div>
            <div class="flex items-center justify-between mb-1.5">
              <span class="text-xs font-medium text-slate-500 dark:text-slate-400">地址</span>
              <label class="switch"><input type="checkbox" id="showAddress" checked><span class="slider"></span></label>
            </div>
            <input id="addressText" type="text" autocomplete="off" placeholder="默认从坐标位置获取"
              class="w-full rounded-xl border border-slate-300 dark:border-slate-600 bg-slate-50 dark:bg-slate-900 px-3 py-2 text-sm text-slate-800 dark:text-slate-100 outline-none focus:border-emerald-500 focus:ring-2 focus:ring-emerald-500/30 transition">
          </div>
          <div>
            <div class="flex items-center justify-between mb-1.5">
              <span class="text-xs font-medium text-slate-500 dark:text-slate-400">GCJ坐标</span>
              <label class="switch"><input type="checkbox" id="showCoords" checked><span class="slider"></span></label>
            </div>
            <input id="coordsText" type="text" autocomplete="off" placeholder="经度E，纬度N（高德GCJ-02坐标）"
              class="w-full rounded-xl border border-slate-300 dark:border-slate-600 bg-slate-50 dark:bg-slate-900 px-3 py-2 text-sm text-slate-800 dark:text-slate-100 outline-none focus:border-emerald-500 focus:ring-2 focus:ring-emerald-500/30 transition">
          </div>
          <div>
            <div class="flex items-center justify-between mb-1.5">
              <span class="text-xs font-medium text-slate-500 dark:text-slate-400">拍摄日期</span>
              <label class="switch"><input type="checkbox" id="showDate" checked><span class="slider"></span></label>
            </div>
            <input id="dateText" type="text" placeholder="YYYY-MM-DD（自动从EXIF获取）"
              class="w-full rounded-xl border border-slate-300 dark:border-slate-600 bg-slate-50 dark:bg-slate-900 px-3 py-2 text-sm text-slate-800 dark:text-slate-100 outline-none focus:border-emerald-500 focus:ring-2 focus:ring-emerald-500/30 transition">
          </div>
          <div class="sm:col-span-2">
            <div class="flex items-center justify-between mb-1.5">
              <span class="text-xs font-medium text-slate-500 dark:text-slate-400">静态地图</span>
              <label class="switch"><input type="checkbox" id="showMap" checked><span class="slider"></span></label>
            </div>
            <div class="zoom-row">
              <span class="zoom-range">3</span>
              <input type="range" id="mapZoom" min="3" max="18" value="15" step="1">
              <span class="zoom-range">18</span>
              <span class="zoom-value" id="mapZoomValue">15</span>
            </div>
            <div id="mapPreview" style="display:none" class="mt-2">
              <img id="mapPreviewImg" src="" class="w-full max-w-[360px] rounded-xl border border-slate-200 dark:border-slate-700">
            </div>
          </div>
        </div>

        <div class="flex gap-3 mt-5">
          <button id="processBtn" onclick="startBatchProcess()"
            class="flex-1 bg-emerald-500 hover:bg-emerald-600 text-white rounded-xl py-2.5 font-medium shadow-sm hover:shadow-md transition active:scale-[.98]">批量加水印</button>
          <button onclick="clearAll()"
            class="flex-1 border border-slate-300 dark:border-slate-600 text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-700 rounded-xl py-2.5 font-medium transition active:scale-[.98]">清空</button>
        </div>
      </div>
    </section>

    <!-- ===== 步骤 3：处理与导出 ===== -->
    <section class="grid grid-cols-1 sm:grid-cols-2 gap-3">
      <button id="downloadBtn" onclick="downloadAll()" disabled
        class="flex items-center justify-center gap-2 bg-slate-800 dark:bg-slate-700 text-white rounded-2xl py-3.5 font-medium shadow-sm hover:shadow-md transition active:scale-[.98] disabled:opacity-40 disabled:cursor-not-allowed">
        📦 生成压缩包
      </button>
      <button id="albumBtn" onclick="saveToAlbum()" disabled
        class="flex items-center justify-center gap-2 bg-gradient-to-r from-emerald-500 to-teal-500 text-white rounded-2xl py-3.5 font-medium shadow-sm hover:shadow-md transition active:scale-[.98] disabled:opacity-40 disabled:cursor-not-allowed">
        📲 保存到相册
      </button>
    </section>

    <!-- 进度 -->
    <div id="progressArea" style="display:none" class="bg-white dark:bg-slate-800/80 rounded-2xl shadow-sm border border-slate-200 dark:border-slate-700/60 p-4 transition-colors">
      <div class="progress-bar"><div class="progress-fill" id="progressFill" style="width:0%"></div></div>
      <div class="progress-text" id="progressText">准备中...</div>
      <div id="perfLive" class="mt-2 text-xs font-mono text-slate-500 dark:text-slate-400">⚙ 等待开始…</div>
    </div>

    <!-- 日志 -->
    <section id="logCard" class="bg-white dark:bg-slate-800/80 rounded-2xl shadow-sm border border-slate-200 dark:border-slate-700/60 overflow-hidden transition-colors">
      <div class="px-5 py-3.5 border-b border-slate-100 dark:border-slate-700/50 flex items-center gap-3 cursor-pointer" onclick="toggleLog(this)">
        <span class="text-base">📋</span>
        <h2 class="text-[15px] font-semibold text-slate-800 dark:text-slate-100">处理日志</h2>
        <div class="ml-auto flex items-center gap-2">
          <button onclick="event.stopPropagation();copyDebugInfo()" title="复制调试信息到剪贴板，方便直接粘贴反馈"
            class="px-3 py-1.5 rounded-lg border border-slate-300 dark:border-slate-600 text-slate-600 dark:text-slate-300 text-xs hover:bg-slate-100 dark:hover:bg-slate-700 transition">复制</button>
          <button onclick="event.stopPropagation();exportDebugInfo()" title="导出配置+日志+每照片步骤时间线，方便反馈问题"
            class="px-3 py-1.5 rounded-lg border border-slate-300 dark:border-slate-600 text-slate-600 dark:text-slate-300 text-xs hover:bg-slate-100 dark:hover:bg-slate-700 transition">导出</button>
          <span class="text-xs text-slate-400 dark:text-slate-500 log-toggle-text">展开 ▼</span>
        </div>
      </div>
      <div class="p-0" id="logBody" style="display:none">
        <div class="log-area m-4" id="logArea"></div>
      </div>
    </section>

  </main>

  <!-- ===== 预览弹窗 ===== -->
  <div class="modal-overlay" id="previewModal">
    <div class="modal-content">
      <button class="modal-close" onclick="closePreview()">✕</button>
      <img id="previewImg" src="">
      <div class="modal-info" id="previewInfo"></div>
    </div>
  </div>

  <!-- 隐藏的文件输入 -->
  <input type="file" id="fileInput" multiple accept="image/*" style="display:none">

  <!-- 隐藏的画布 -->
  <canvas id="watermarkCanvas" style="display:none"></canvas>

  <!-- 第三方库 -->
  <script src="https://cdn.jsdelivr.net/npm/piexifjs@1.0.6/piexif.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/file-saver@2.0.5/dist/FileSaver.min.js"></script>
  <!-- jpeg-js: 纯JS JPEG编解码器，分块水印方案依赖 -->
  <script src="lib/jpeg-js.bundle.js"></script>

  <!-- 应用脚本 -->
  <script src="js/coord-transform.js"></script>
  <script src="js/exif-utils.js"></script>
  <script src="js/watermark.js"></script>
  <script src="js/watermark-chunked.js"></script>
  <script src="js/app.js"></script>

  <script>
    // 配置卡片收起 / 展开
    function toggleConfig() {
      var body = document.getElementById('configBody')
      var toggle = document.getElementById('configToggle')
      if (body.style.display === 'none') {
        body.style.display = ''
        toggle.textContent = '收起 ▲'
      } else {
        body.style.display = 'none'
        toggle.textContent = '展开 ▼'
      }
    }
    // 日志卡片展开 / 收起
    function toggleLog(header) {
      var body = document.getElementById('logBody')
      var txt = header.querySelector('.log-toggle-text')
      if (body.style.display === 'none') {
        body.style.display = ''
        if (txt) txt.textContent = '收起 ▲'
      } else {
        body.style.display = 'none'
        if (txt) txt.textContent = '展开 ▼'
      }
    }
  </script>
</body>
</html>
