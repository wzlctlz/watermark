<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>水印相机</title>

  <!-- 书签/桌面图标：SVG 矢量优先，多尺寸 PNG 兜底 -->
  <!-- 每个图标 URL 带 ?v=版本号 作为缓存键：版本推进即 URL 变化，浏览器重新下载，书签在下次访问时拉取新版 -->
  <link rel="icon" type="image/svg+xml" href="favicon.svg?v=v20260817-2318">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png?v=v20260817-2318">
  <link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png?v=v20260817-2318">
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png?v=v20260817-2318">
  <link rel="manifest" href="manifest.webmanifest?v=v20260817-2318">
  <meta name="theme-color" content="#10b981">

  <!-- Tailwind CSS（主流开源UI框架，免构建） -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: { brand: { DEFAULT: '#10b981', dark: '#34d399' } },
          fontFamily: { sans: ['-apple-system', 'BlinkMacSystemFont', '"Segoe UI"', 'Roboto', '"PingFang SC"', '"Microsoft YaHei"', 'sans-serif'] }
        }
      }
    }
  </script>

  <!-- 主题初始化：在首屏渲染前同步设置，避免明暗闪烁 -->
  <script>
    (function () {
      try {
        var saved = localStorage.getItem('wm-theme') || 'system'
        var sysDark = window.matchMedia('(prefers-color-scheme: dark)').matches
        var isDark = saved === 'dark' || (saved === 'system' && sysDark)
        document.documentElement.classList.toggle('dark', isDark)
        document.documentElement.setAttribute('data-theme', saved)
      } catch (e) {}
    })()
  </script>

  <style>
    /* ===== 主题变量（明暗两态，由 .dark 切换） ===== */
    :root {
      --bg: #f1f5f9;
      --card: #ffffff;
      --primary: #10b981;
      --primary-hover: #059669;
      --primary-light: #ecfdf5;
      --text: #1e293b;
      --text2: #64748b;
      --border: #e2e8f0;
      --danger: #ef4444;
      --success: #10b981;
      --warning: #f59e0b;
      --input-bg: #f8fafc;
      --log-bg: #0f172a;
      --log-text: #cbd5e1;
    }
    html.dark {
      --bg: #0b1120;
      --card: #15203a;
      --primary: #10b981;
      --primary-hover: #34d399;
      --primary-light: #06231b;
      --text: #e2e8f0;
      --text2: #94a3b8;
      --border: #2b3a55;
      --input-bg: #0e1830;
      --log-bg: #060b16;
      --log-text: #cbd5e1;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', 'Microsoft YaHei', sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
      transition: background .3s ease, color .3s ease;
      -webkit-font-smoothing: antialiased;
    }
    /* 适配刘海/灵动岛：viewport-fit=cover 后给主容器留出安全区 */
    @supports (padding: env(safe-area-inset-left)) {
      .max-w-4xl.mx-auto {
        padding-left: calc(1rem + env(safe-area-inset-left));
        padding-right: calc(1rem + env(safe-area-inset-right));
      }
      body { padding-top: env(safe-area-inset-top); padding-bottom: env(safe-area-inset-bottom); }
    }

    /* ===== 照片网格（群成员头像式） ===== */
    .photo-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 12px; }
    .photo-item {
      position: relative; border-radius: 16px; overflow: hidden; aspect-ratio: 1/1;
      background: var(--input-bg); cursor: pointer; border: 1px solid var(--border);
      box-shadow: 0 2px 6px rgba(0,0,0,.04);
      transition: transform .2s ease, box-shadow .2s ease, border-color .2s ease;
    }
    .photo-item:hover { transform: translateY(-3px); box-shadow: 0 10px 24px rgba(0,0,0,.12); border-color: rgba(16,185,129,.4); }
    .photo-item.selected { border-color: transparent; }
    .photo-item.select-mode { cursor: crosshair; }
    /* 选中态：流动渐变圈（青绿系，与按键色协调） */
    @property --wm-angle { syntax: '<angle>'; initial-value: 0deg; inherits: false; }
    .sel-frame {
      position: absolute; inset: 0; border-radius: 16px; padding: 3px; pointer-events: none; z-index: 9;
      background: conic-gradient(from var(--wm-angle), #34d399, #10b981, #14b8a6, #06b6d4, #34d399);
      -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      -webkit-mask-composite: xor; mask-composite: exclude;
      animation: wmAngle 3.2s linear infinite;
      filter: drop-shadow(0 0 6px rgba(16,185,129,.55));
    }
    @keyframes wmAngle { to { --wm-angle: 360deg; } }
    .photo-item.select-mode:hover { border-color: var(--primary); box-shadow: 0 6px 16px rgba(16,185,129,.14); }
    .photo-item img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .photo-item .btn-delete {
      position: absolute; top: 6px; right: 6px; width: 22px; height: 22px; border-radius: 50%;
      background: rgba(239,68,68,.92); color: #fff; border: none; font-size: 15px; line-height: 22px;
      text-align: center; cursor: pointer; z-index: 10; display: flex; align-items: center; justify-content: center;
      padding: 0; opacity: 0; transition: opacity .2s, transform .15s;
    }
    .photo-item .btn-delete:active { transform: scale(.9); }
    .photo-item:hover .btn-delete { opacity: 1; }
    @media (hover: none) { .photo-item .btn-delete { opacity: .85; } }
    /* 左上角艺术角标：GPS 状态 + 半行艺术字分辨率 */
    .photo-item .corner { position: absolute; top: 7px; left: 7px; display: flex; flex-direction: column; align-items: flex-start; gap: 5px; z-index: 5; pointer-events: none; }
    .corner .chip { display: inline-flex; align-items: center; gap: 4px; padding: 3px 8px; border-radius: 9px;
      font-size: 10px; font-weight: 800; letter-spacing: .02em; color: #fff; line-height: 1.1;
      backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
      border: 1px solid rgba(255,255,255,.35); box-shadow: 0 2px 8px rgba(0,0,0,.35); }
    .corner .chip-gps { background: linear-gradient(135deg, rgba(16,185,129,.94), rgba(6,182,212,.94)); }
    .corner .chip-nogps { background: linear-gradient(135deg, rgba(245,158,11,.96), rgba(239,68,68,.94)); }
    .corner .chip-done { background: linear-gradient(135deg, rgba(99,102,241,.96), rgba(168,85,247,.96)); }
    .corner .chip-res { background: linear-gradient(135deg, rgba(15,23,42,.8), rgba(30,41,59,.8)); }
    /* 大号半透明艺术字分辨率，压在左上角半行 */
    .corner .res-art { font-family: 'Arial Black','PingFang SC','Microsoft YaHei',sans-serif; font-weight: 900;
      font-size: 30px; line-height: .9; letter-spacing: -.02em; color: rgba(255,255,255,.22);
      text-shadow: 0 2px 10px rgba(0,0,0,.45); margin-left: 1px; }
    .photo-item .filename { position: absolute; bottom: 0; left: 0; right: 0; padding: 4px 6px; background: rgba(0,0,0,.55); color: #fff; font-size: 10px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    /* ===== 添加照片格（末尾 + 号） ===== */
    .add-cell {
      aspect-ratio: 1/1; border-radius: 16px; border: 2px dashed var(--border);
      background: rgba(16,185,129,.04); cursor: pointer; display: flex; align-items: center; justify-content: center;
      transition: all .25s ease; min-height: 96px;
    }
    .add-cell:hover { border-color: var(--primary); background: rgba(16,185,129,.10); transform: translateY(-3px); box-shadow: 0 10px 24px rgba(16,185,129,.12); }
    .add-cell:active { transform: scale(.96); }
    .add-cell .plus {
      width: 36px; height: 36px; position: relative; color: var(--text2); transition: color .2s;
    }
    .add-cell:hover .plus { color: var(--primary); }
    .add-cell .plus::before, .add-cell .plus::after {
      content: ''; position: absolute; background: currentColor; border-radius: 2px;
    }
    .add-cell .plus::before { width: 2px; height: 24px; left: 50%; top: 50%; transform: translate(-50%, -50%); }
    .add-cell .plus::after { width: 24px; height: 2px; left: 50%; top: 50%; transform: translate(-50%, -50%); }

    /* ===== 预览弹窗 ===== */
    .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.82); z-index: 1000; align-items: center; justify-content: center; padding: 16px; backdrop-filter: blur(4px); }
    .modal-overlay.active { display: flex; }
    .modal-content { max-width: 92vw; max-height: 92vh; position: relative; }
    .modal-content img { max-width: 100%; max-height: 90vh; border-radius: 12px; box-shadow: 0 20px 60px rgba(0,0,0,.5); }
    .modal-close { position: absolute; top: -14px; right: -14px; width: 34px; height: 34px; border-radius: 50%; background: #fff; border: none; font-size: 18px; cursor: pointer; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 12px rgba(0,0,0,.4); z-index: 10; }

    /* ===== 日志区 ===== */
    .log-area { height: 180px; overflow-y: auto; background: var(--log-bg); color: var(--log-text); padding: 12px 14px; border-radius: 12px; font-family: 'Consolas','Monaco','SF Mono', monospace; font-size: 11px; line-height: 1.7; }
    .log-ok { color: #34d399; }
    .log-warn { color: #fbbf24; }
    .log-err { color: #f87171; }

    /* ===== 进度条（青绿系，与按键色协调） ===== */
    .progress-wrap { text-align: center; }
    .progress-percent {
      font-size: 22px; font-weight: 700; letter-spacing: -0.02em;
      background: linear-gradient(90deg, #10b981, #14b8a6, #06b6d4);
      -webkit-background-clip: text; background-clip: text; color: transparent;
      margin-bottom: 10px; line-height: 1;
    }
    .progress-bar {
      height: 10px; border-radius: 999px; overflow: hidden; position: relative;
      background: rgba(16,185,129,.10); box-shadow: inset 0 1px 2px rgba(0,0,0,.06);
    }
    .progress-fill {
      height: 100%; border-radius: 999px; position: relative;
      background: linear-gradient(90deg, #34d399, #10b981, #14b8a6, #06b6d4);
      box-shadow: 0 0 16px rgba(16,185,129,.35);
      transition: width .35s cubic-bezier(.4,0,.2,1);
    }
    .progress-text { font-size: 12px; color: var(--text2); margin-top: 10px; text-align: center; letter-spacing: .02em; }

    /* 实时性能指示：简洁文字 */
    .perf-live { margin-top: 10px; font-size: 12px; color: var(--text2); }

    /* ===== 统计徽章（强制四等分，自动缩放，保持相对位置不变） ===== */
    .stat-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: clamp(6px, 1.6vw, 12px); }
    .stat-chip {
      display: flex; align-items: center; justify-content: center; gap: clamp(3px, 0.8vw, 6px);
      padding: clamp(5px, 1.2vw, 9px) clamp(5px, 1.2vw, 12px);
      border-radius: 999px; white-space: nowrap; min-width: 0;
      background: var(--input-bg); border: 1px solid var(--border);
      box-shadow: 0 1px 3px rgba(0,0,0,.04);
      transition: transform .15s ease, box-shadow .15s ease;
    }
    .stat-chip:hover { transform: translateY(-1px); box-shadow: 0 4px 10px rgba(0,0,0,.08); }
    .stat-dot { width: clamp(6px, 1.2vw, 8px); height: clamp(6px, 1.2vw, 8px); border-radius: 50%; flex-shrink: 0; }
    .stat-label { font-size: clamp(10px, 2.8vw, 12px); color: var(--text2); font-weight: 500; }
    .stat-num { font-size: clamp(12px, 3.2vw, 14px); color: var(--text); font-weight: 700; }
    @media (max-width: 360px) {
      .stat-row { gap: 5px; }
      .stat-chip { padding: 5px 6px; }
      .stat-label { display: none; }
      .stat-num { font-size: 13px; }
    }

    /* ===== 开关 ===== */
    .switch { position: relative; display: inline-block; width: 40px; height: 22px; flex-shrink: 0; }
    .switch input { opacity: 0; width: 0; height: 0; }
    .switch .slider { position: absolute; inset: 0; background: #cbd5e1; border-radius: 22px; cursor: pointer; transition: .25s; }
    .switch .slider:before { content: ''; position: absolute; height: 16px; width: 16px; left: 3px; top: 3px; background: #fff; border-radius: 50%; transition: .25s; box-shadow: 0 1px 3px rgba(0,0,0,.25); }
    .switch input:checked + .slider { background: var(--primary); }
    .switch input:checked + .slider:before { transform: translateX(18px); }

    /* ===== 缩放滑块 ===== */
    .zoom-row { display: flex; align-items: center; gap: 10px; margin-top: 6px; }
    .zoom-row input[type=range] { flex: 1; height: 6px; -webkit-appearance: none; appearance: none; background: var(--border); border-radius: 3px; outline: none; }
    .zoom-row input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 18px; height: 18px; border-radius: 50%; background: var(--primary); cursor: pointer; box-shadow: 0 1px 4px rgba(0,0,0,.3); }
    .zoom-row input[type=range]::-moz-range-thumb { width: 18px; height: 18px; border: none; border-radius: 50%; background: var(--primary); cursor: pointer; }
    .zoom-value { font-size: 13px; font-weight: 700; color: var(--text); min-width: 22px; text-align: center; }
    .zoom-range { font-size: 11px; color: var(--text2); }

    /* ===== 玻璃拟态卡片 ===== */
    .glass-card {
      position: relative; border-radius: 20px;
      background: rgba(255,255,255,.72); backdrop-filter: blur(14px);
      border: 1px solid rgba(255,255,255,.5);
      box-shadow: 0 8px 32px rgba(2,8,20,.08);
      overflow: hidden; transition: background .3s, border-color .3s, box-shadow .3s;
    }
    html.dark .glass-card { background: rgba(21,32,58,.72); border-color: rgba(255,255,255,.08); box-shadow: 0 8px 32px rgba(0,0,0,.28); }
    .glass-card::before {
      content: ''; position: absolute; inset: 0; border-radius: 20px; padding: 1px;
      background: linear-gradient(135deg, rgba(255,255,255,.55), rgba(255,255,255,0));
      -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      -webkit-mask-composite: xor; mask-composite: exclude; pointer-events: none;
    }
    html.dark .glass-card::before { background: linear-gradient(135deg, rgba(255,255,255,.12), rgba(255,255,255,0)); }

    /* 输出质量分段选择 */
    .quality-seg { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
    .quality-seg .q-opt {
      padding: 9px 0; font-size: 13px; font-weight: 600; text-align: center;
      border-radius: 10px; cursor: pointer; transition: all .2s ease;
      border: 1px solid #cbd5e1; background: #f1f5f9; color: #475569;
    }
    .dark .quality-seg .q-opt { border-color: #475569; background: #1e293b; color: #cbd5e1; }
    .quality-seg .q-opt:hover { border-color: #10b981; }
    .quality-seg .q-opt.active {
      background: linear-gradient(135deg, #10b981, #14b8a6); color: #fff; border-color: transparent;
      box-shadow: 0 4px 12px rgba(16,185,129,.3);
    }

    /* 渐变按钮 */
    .btn-gradient {
      background: linear-gradient(135deg, #10b981 0%, #14b8a6 50%, #06b6d4 100%);
      background-size: 200% 200%;
      color: #fff; border: none; transition: all .25s ease;
      box-shadow: 0 4px 14px rgba(16,185,129,.35);
    }
    .btn-gradient:hover { background-position: 100% 0; box-shadow: 0 6px 20px rgba(16,185,129,.45); transform: translateY(-1px); }
    .btn-gradient:active { transform: translateY(1px); }

    /* 次要按钮 */
    .btn-ghost {
      background: rgba(148,163,184,.12); color: var(--text); border: 1px solid var(--border);
      transition: all .2s ease;
    }
    .btn-ghost:hover { background: rgba(148,163,184,.20); border-color: var(--primary); }

    /* ===== 动画 / 滚动条 ===== */
    @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
    .photo-item { animation: fadeIn .25s ease; }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-thumb { background: #94a3b8; border-radius: 3px; }
  </style>
</head>
<body>

  <!-- ===== 顶部栏 ===== -->
  <header class="sticky top-0 z-50 backdrop-blur bg-white/80 dark:bg-slate-900/80 border-b border-slate-200 dark:border-slate-800 transition-colors">
    <div class="max-w-4xl mx-auto px-4 h-14 flex items-center justify-between">
      <div class="leading-tight">
        <h1 class="text-lg font-bold bg-clip-text text-transparent bg-gradient-to-r from-emerald-500 to-teal-400">水印相机</h1>
      </div>
      <button onclick="cycleTheme()" title="切换主题（系统 / 日间 / 夜间）"
        class="group flex items-center gap-1.5 px-3 py-1.5 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-700 transition text-sm">
        <span id="themeIcon">🌐</span>
        <span id="themeLabel" class="hidden sm:inline text-xs">跟随系统</span>
      </button>
    </div>
  </header>

  <main class="max-w-4xl mx-auto px-4 py-6 space-y-5">

    <!-- ===== 步骤 1：添加照片 ===== -->
    <section class="glass-card">
      <div class="px-5 py-4 border-b border-slate-100 dark:border-slate-700/50 flex items-center justify-between">
        <div class="flex items-center gap-3">
          <span class="flex items-center justify-center w-7 h-7 rounded-lg bg-emerald-500 text-white text-sm font-bold">1</span>
          <h2 class="text-[15px] font-semibold text-slate-800 dark:text-slate-100">添加照片</h2>
        </div>
      </div>
      <div class="p-5">
        <div id="statsCard" class="stat-row mb-4">
          <div class="stat-chip" title="总计">
            <span class="stat-dot bg-emerald-500"></span>
            <span class="stat-label">总计</span>
            <b id="statTotal" class="stat-num">0</b>
          </div>
          <div class="stat-chip" title="有GPS">
            <span class="stat-dot bg-emerald-500"></span>
            <span class="stat-label">有GPS</span>
            <b id="statGps" class="stat-num">0</b>
          </div>
          <div class="stat-chip" title="无GPS">
            <span class="stat-dot bg-amber-500"></span>
            <span class="stat-label">无GPS</span>
            <b id="statNoGps" class="stat-num">0</b>
          </div>
          <div class="stat-chip" title="已处理">
            <span class="stat-dot bg-violet-500"></span>
            <span class="stat-label">已处理</span>
            <b id="statDone" class="stat-num">0</b>
          </div>
        </div>

        <div class="photo-grid" id="photoGrid">
          <div class="add-cell" id="addCell" onclick="document.getElementById('fileInput').click()" title="添加照片">
            <div class="plus"></div>
          </div>
        </div>
      </div>
    </section>

    <!-- ===== 步骤 2：水印配置 ===== -->
    <section class="glass-card">
      <div class="px-5 py-4 border-b border-slate-100 dark:border-slate-700/50 flex items-center gap-3">
        <span class="flex items-center justify-center w-7 h-7 rounded-lg bg-emerald-500 text-white text-sm font-bold">2</span>
        <h2 class="text-[15px] font-semibold text-slate-800 dark:text-slate-100">水印配置</h2>
        <div class="ml-auto flex items-center gap-2">
          <button onclick="event.stopPropagation();loadPhotoInfo()" title="从列表中选择一张照片，加载其GPS信息"
            class="px-3 py-1.5 rounded-lg bg-emerald-500/10 text-emerald-600 dark:text-emerald-400 border border-emerald-500/30 hover:bg-emerald-500/20 text-xs font-medium transition active:scale-95">加载照片信息</button>
          <button id="configToggle" onclick="toggleConfig()"
            class="px-2 py-1.5 rounded-lg text-xs text-slate-400 dark:text-slate-500 hover:bg-slate-100 dark:hover:bg-slate-700 transition">收起 ▲</button>
        </div>
      </div>
      <div class="p-5" id="configBody">
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-x-5 gap-y-4">
          <div>
            <div class="flex items-center justify-between mb-1.5">
              <span class="text-xs font-medium text-slate-500 dark:text-slate-400">项目名称</span>
              <label class="switch"><input type="checkbox" id="showProject" checked><span class="slider"></span></label>
            </div>
            <input id="projectName" type="text" placeholder="例：XX工程勘察"
              class="w-full rounded-xl border border-slate-300 dark:border-slate-600 bg-slate-50 dark:bg-slate-900 px-3 py-2 text-sm text-slate-800 dark:text-slate-100 outline-none focus:border-emerald-500 focus:ring-2 focus:ring-emerald-500/30 transition">
          </div>
          <div>
            <div class="flex items-center justify-between mb-1.5">
              <span class="text-xs font-medium text-slate-500 dark:text-slate-400">备注</span>
              <label class="switch"><input type="checkbox" id="showRemark" checked><span class="slider"></span></label>
            </div>
            <input id="remarkText" type="text" placeholder="自定义备注内容"
              class="w-full rounded-xl border border-slate-300 dark:border-slate-600 bg-slate-50 dark:bg-slate-900 px-3 py-2 text-sm text-slate-800 dark:text-slate-100 outline-none focus:border-emerald-500 focus:ring-2 focus:ring-emerald-500/30 transition">
          </div>
          <div>
            <div class="flex items-center justify-between mb-1.5">
              <span class="text-xs font-medium text-slate-500 dark:text-slate-400">地址</span>
              <label class="switch"><input type="checkbox" id="showAddress" checked><span class="slider"></span></label>
            </div>
            <input id="addressText" type="text" autocomplete="off" placeholder="默认从坐标位置获取"
              class="w-full rounded-xl border border-slate-300 dark:border-slate-600 bg-slate-50 dark:bg-slate-900 px-3 py-2 text-sm text-slate-800 dark:text-slate-100 outline-none focus:border-emerald-500 focus:ring-2 focus:ring-emerald-500/30 transition">
          </div>
          <div>
            <div class="flex items-center justify-between mb-1.5">
              <span class="text-xs font-medium text-slate-500 dark:text-slate-400">GCJ坐标</span>
              <label class="switch"><input type="checkbox" id="showCoords" checked><span class="slider"></span></label>
            </div>
            <input id="coordsText" type="text" autocomplete="off" placeholder="经度E，纬度N（高德GCJ-02坐标）"
              class="w-full rounded-xl border border-slate-300 dark:border-slate-600 bg-slate-50 dark:bg-slate-900 px-3 py-2 text-sm text-slate-800 dark:text-slate-100 outline-none focus:border-emerald-500 focus:ring-2 focus:ring-emerald-500/30 transition">
          </div>
          <div>
            <div class="flex items-center justify-between mb-1.5">
              <span class="text-xs font-medium text-slate-500 dark:text-slate-400">拍摄日期</span>
              <label class="switch"><input type="checkbox" id="showDate" checked><span class="slider"></span></label>
            </div>
            <input id="dateText" type="text" placeholder="YYYY-MM-DD（自动从EXIF获取）"
              class="w-full rounded-xl border border-slate-300 dark:border-slate-600 bg-slate-50 dark:bg-slate-900 px-3 py-2 text-sm text-slate-800 dark:text-slate-100 outline-none focus:border-emerald-500 focus:ring-2 focus:ring-emerald-500/30 transition">
          </div>
          <div class="sm:col-span-2">
            <div class="flex items-center justify-between mb-1.5">
              <span class="text-xs font-medium text-slate-500 dark:text-slate-400">静态地图</span>
              <label class="switch"><input type="checkbox" id="showMap" checked><span class="slider"></span></label>
            </div>
            <div class="zoom-row">
              <span class="zoom-range">3</span>
              <input type="range" id="mapZoom" min="3" max="18" value="15" step="1">
              <span class="zoom-range">18</span>
              <span class="zoom-value" id="mapZoomValue">15</span>
            </div>
            <div id="mapPreview" style="display:none" class="mt-2">
              <img id="mapPreviewImg" src="" class="w-full max-w-[360px] rounded-xl border border-slate-200 dark:border-slate-700">
            </div>
          </div>

          <!-- 输出质量：分辨率保持原图不变，仅调节 JPEG 压缩（色彩精度/文件大小） -->
          <div class="sm:col-span-2 mt-1">
            <div class="flex items-center justify-between mb-1.5">
              <span class="text-xs font-medium text-slate-500 dark:text-slate-400">输出质量</span>
              <span class="text-[11px] text-emerald-500 dark:text-emerald-400 font-medium">仅压缩画质·不降分辨率</span>
            </div>
            <div class="quality-seg" id="qualitySeg">
              <button type="button" data-q="1" onclick="setQuality(this)" class="q-opt" title="JPEG 质量 100%（近似无损，文件最大）">无损</button>
              <button type="button" data-q="0.95" onclick="setQuality(this)" class="q-opt active" title="JPEG 质量 95%（默认，细节最佳）">高保真</button>
              <button type="button" data-q="0.85" onclick="setQuality(this)" class="q-opt" title="JPEG 质量 85%（文件适中）">标准</button>
              <button type="button" data-q="0.7" onclick="setQuality(this)" class="q-opt" title="JPEG 质量 70%（最省空间）">省空间</button>
            </div>
          </div>
        </div>

        <div class="flex gap-3 mt-5">
          <button id="processBtn" onclick="startBatchProcess()"
            class="flex-1 btn-gradient rounded-xl py-2.5 font-medium active:scale-[.98]">批量加水印</button>
          <button onclick="clearAll()"
            class="flex-1 btn-ghost rounded-xl py-2.5 font-medium active:scale-[.98]">清空</button>
        </div>
      </div>
    </section>

    <!-- ===== 步骤 3：处理与导出 ===== -->
    <section class="grid grid-cols-1 sm:grid-cols-2 gap-3">
      <button id="downloadBtn" onclick="downloadAll()" disabled
        class="flex items-center justify-center gap-2 btn-ghost rounded-2xl py-3.5 font-medium active:scale-[.98] disabled:opacity-40 disabled:cursor-not-allowed">
        生成压缩包
      </button>
      <button id="albumBtn" onclick="saveToAlbum()" disabled
        class="flex items-center justify-center gap-2 btn-gradient rounded-2xl py-3.5 font-medium active:scale-[.98] disabled:opacity-40 disabled:cursor-not-allowed">
        保存到相册
      </button>
    </section>

    <!-- 进度 -->
    <div id="progressArea" style="display:none" class="glass-card p-5">
      <div class="progress-wrap">
        <div class="progress-percent" id="progressPercent">0%</div>
        <div class="progress-bar"><div class="progress-fill" id="progressFill" style="width:0%"></div></div>
        <div class="progress-text" id="progressText">准备中...</div>
        <div id="perfLive" class="perf-live">等待开始…</div>
      </div>
    </div>

    <!-- 日志 -->
    <section id="logCard" class="glass-card">
      <div class="px-5 py-3.5 border-b border-slate-100 dark:border-slate-700/50 flex items-center gap-3 cursor-pointer" onclick="toggleLog(this)">
        <h2 class="text-[15px] font-semibold text-slate-800 dark:text-slate-100">处理日志</h2>
        <div class="ml-auto flex items-center gap-2">
          <button onclick="event.stopPropagation();copyDebugInfo()" title="复制调试信息到剪贴板，方便直接粘贴反馈"
            class="px-3 py-1.5 rounded-lg border border-slate-300 dark:border-slate-600 text-slate-600 dark:text-slate-300 text-xs hover:bg-slate-100 dark:hover:bg-slate-700 transition">复制</button>
          <button onclick="event.stopPropagation();exportDebugInfo()" title="导出配置+日志+每照片步骤时间线，方便反馈问题"
            class="px-3 py-1.5 rounded-lg border border-slate-300 dark:border-slate-600 text-slate-600 dark:text-slate-300 text-xs hover:bg-slate-100 dark:hover:bg-slate-700 transition">导出</button>
          <span class="text-xs text-slate-400 dark:text-slate-500 log-toggle-text">展开 ▼</span>
        </div>
      </div>
      <div class="p-0" id="logBody" style="display:none">
        <div class="log-area m-4" id="logArea"></div>
      </div>
    </section>

  </main>

  <!-- ===== 预览弹窗 ===== -->
  <div class="modal-overlay" id="previewModal">
    <div class="modal-content">
      <button class="modal-close" onclick="closePreview()">✕</button>
      <img id="previewImg" src="">
    </div>
  </div>

  <!-- 隐藏的文件输入（相册 / 拍照 / 文件选择；iOS 会提供“拍照”选项，返回原图带 GPS） -->
  <input type="file" id="fileInput" multiple accept="image/*" style="display:none">

  <!-- 隐藏的画布 -->
  <canvas id="watermarkCanvas" style="display:none"></canvas>

  <!-- 第三方库 -->
  <script src="https://cdn.jsdelivr.net/npm/piexifjs@1.0.6/piexif.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/file-saver@2.0.5/dist/FileSaver.min.js"></script>
  <!-- jpeg-js: 纯JS JPEG编解码器，分块水印方案依赖 -->
  <script src="lib/jpeg-js.bundle.js"></script>

  <!-- 应用脚本 -->
  <script src="js/coord-transform.js"></script>
  <script src="js/exif-utils.js"></script>
  <script src="js/watermark.js"></script>
  <script src="js/watermark-chunked.js"></script>
  <script src="js/app.js?v=8"></script>

  <script>
    // 配置卡片收起 / 展开
    function toggleConfig() {
      var body = document.getElementById('configBody')
      var toggle = document.getElementById('configToggle')
      if (body.style.display === 'none') {
        body.style.display = ''
        toggle.textContent = '收起 ▲'
      } else {
        body.style.display = 'none'
        toggle.textContent = '展开 ▼'
      }
    }
    // 日志卡片展开 / 收起
    function toggleLog(header) {
      var body = document.getElementById('logBody')
      var txt = header.querySelector('.log-toggle-text')
      if (body.style.display === 'none') {
        body.style.display = ''
        if (txt) txt.textContent = '收起 ▲'
      } else {
        body.style.display = 'none'
        if (txt) txt.textContent = '展开 ▼'
      }
    }
  </script>
</body>
</html>
